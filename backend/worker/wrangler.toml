# Cloudflare Worker config for the AI evaluation proxy.
#
# Deploy from this folder:
#   wrangler login
#   wrangler deploy
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put ALLOWED_ORIGINS     <- before sharing the app link
#
# NEVER put the API key in this file. Secrets set with `wrangler secret put`
# are encrypted and never appear here, in the dashboard, or in git. A key in
# a [vars] block would be committed in plain text.

name = "interview-judge"
main = "interview-judge.js"
compatibility_date = "2024-11-01"

# Optional per-IP daily cap. Create the namespace first:
#   wrangler kv namespace create RATE
# then paste the id it prints below, uncomment both lines, and set the limit:
#   wrangler secret put DAILY_LIMIT
#
# [[kv_namespaces]]
# binding = "RATE"
# id = "<paste the id wrangler printed>"
